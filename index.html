<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="هوم ستور - كل ما تحتاجه تحت سقف واحد" />
  <meta name="theme-color" content="#C5A059" />
  <link rel="apple-touch-icon" href="/hs-logo.png" />
  <link rel="icon" type="image/png" href="/hs-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap"
    rel="stylesheet">
  <title>هوم ستور - HOME STORE</title>
</head>

<body>
  <div id="root"></div>
  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      // Dispatch a custom event to notify React components
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });

    // Interaction hint to help browsers fire the event
    window.addEventListener('click', () => {
      if (window.deferredPrompt) {
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      }
    }, { once: true });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
